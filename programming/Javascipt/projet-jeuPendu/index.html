<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="reset.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <title>Jeu du Pendu</title>
</head>
<body class="bgBody overlay">

    <header>

        <h1 class="title">Jeu du pendu</h1>

        <nav class="nav">
             <button type="button" class="btnPlay" id="btnPlay">Commencer/Recomencer</button>
        </nav>
    </header>

    <main>

        <div id="motaDeviner" class="zoneMot"></div>

        <div id="zonePendu">
            <div id="astronaute">

                <!-- <div id="personnage">
                    <div class="p-tete"></div>
                    <div class="p-torse"></div>
                    <div class="p-bras gauche"></div>
                    <div class="p-bras droit"></div>
                    <div class="p-jambe gauche"></div>
                    <div class="p-jambe droit"></div>
                </div> -->

                <div class="piece bras bras-gauche"></div>
                <div class="piece bras bras-droit"></div>
                <div class="piece jambe jambe-gauche"></div>
                <div class="piece jambe jambe-droit"></div>
                <div class="piece jetpack"></div>
                <div class="piece torse"></div>
                <div class="piece casque"></div>

            </div>
        </div>

        <div id="zoneMot"></div>

        <div id="zoneSaisie">
            <label for="lettre">Propose une lettre :</label>
            <input type="text" id="lettre" maxlength="1" autocomplete="off" />
        </div>

        <div id="nbErreur">0/7</div>

        <div id="customAlert" class="custom-alert hidden">
          <div class="custom-alert-box">
            <p id="customAlertMessage">Message d'alerte ici</p>
            <button id="customAlertClose">OK</button>
          </div>
        </div>

    </main>

    <script src="js.js"></script>
</body>
</html>
