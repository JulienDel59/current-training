<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link href="reset.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <title>Jeu du Pendu</title>

<body class="bgBody">

        <h1 class="title">Jeu du pendu</h1>

        <nav class="nav">

        </nav>
    </header>

    <main>

        <div id="motaDeviner" class="zoneMot"></div>

        <div id="zonePendu">
            <div id="astronaute">
                <div class="piece bras bras-gauche"></div>
                <div class="piece bras bras-droit"></div>
                <div class="piece jambe jambe-gauche"></div>
                <div class="piece jambe jambe-droit"></div>
                <div class="piece jetpack"></div>
                <div class="piece torse"></div>
                <div class="piece casque"></div>
            </div>
        </div>

        <div id="zoneMot"></div>

        <div id="zoneSaisie">
            <label for="lettre">Propose une lettre :</label>
            <input type="text" id="lettre" maxlength="1" autocomplete="off" />
        </div>

        <div></div>


        <div id="messageJeu"></div>

    </main>

    <script src="js.js"></script>
