<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="reset.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <title>Morpion</title>
</head>
<body class="body">
  

    <header class="header">
      <h1 class="tilte">Morpion</h1>
    </header>
  
    <main class="main">

      <section class="sectionMenu">
        <div class="divChoixPseudo">
          <p>Entrer vos speudo</p>
          <div class="pseudo">
           <label for="player1">Joueur 1</label>
           <input type="text" id="player1" placeholder="Pseudo Joueur 1" />
           <label for="player2">Joueur 2</label>
           <input type="text" id="player2" placeholder="Pseudo Joueur 2" />
          </div>
        </div>
        <div class="divBtnPlay">
         <button type="button" class="btnPlay" id="btnPlay">Jouer</button>
        </div>
      </section>

      <section class="sectionScore">
        <div class="divPlayer1 divPlayer">
          <p id="namePlayer1">Joueur 1</p>
          <p><span id="scoreX">0</span></p></p>
        </div>
        <div class="divPlayer2 divPlayer">
          <p id="namePlayer2">Joueur 2</p>
          <p><span id="scoreO">0</span></p>
        </div>
      </section>

      <div></div>

     <section class="SectionPlateau">
       <div class="morpion">
        <div class="case case1" data-index="0"></div>
        <div class="case case2" data-index="1"></div>
        <div class="case case3" data-index="2"></div>
        <div class="case case4" data-index="3"></div>
        <div class="case case5" data-index="4"></div>
        <div class="case case6" data-index="5"></div>
        <div class="case case7" data-index="6"></div>
        <div class="case case8" data-index="7"></div>
        <div class="case case9" data-index="8"></div>  
       </div>
     </section>
    </main>
   <script src="js.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </body>
</html>
